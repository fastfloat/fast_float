name: Ubuntu 22.04 CI (clang 14)

on: [push, pull_request]

jobs:
  ubuntu-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install clang++-14
        run: sudo apt-get install -y clang++-14
      - name: Check for pedantic warnings in pre-C++20 modes (issue 427)
        run: |
          set -xe
          printf '#include "fast_float/fast_float.h"\nint main() { return 0; }\n' > pedantic_check.cpp
          for std in c++11 c++14 c++17 c++20; do
            clang++-14 -std=$std -Wall -Wextra -pedantic-errors -Werror \
              -Iinclude -fsyntax-only pedantic_check.cpp
          done
      - name: Use cmake
        run: |
          mkdir build &&
          cd build &&
          CXX=clang++-14 cmake -DFASTFLOAT_TEST=ON  ..  &&
          cmake --build .   &&
          ctest --output-on-failure
      - name: Use cmake CXX20
        run: |
          mkdir build20 &&
          cd build20 &&
          CXX=clang++-14 cmake -DFASTFLOAT_CONSTEXPR_TESTS=ON -DFASTFLOAT_CXX_STANDARD=20 -DFASTFLOAT_TEST=ON  ..  &&
          cmake --build .   &&
          ctest --output-on-failure
