name: Alpine Linux
on:
  - push
  - pull_request

jobs:
  build:
    name: Build on Alpine ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch:
          - x86_64
          - x86
          - aarch64
          - armv7
          - ppc64le
          - riscv64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install latest Alpine Linux for ${{ matrix.arch }}
        uses: jirutka/setup-alpine@v1
        with:
          arch: ${{ matrix.arch }}
          # v3.22 is the last release with apk-tools v2; setup-alpine v1 bootstraps
          # with apk.static v2, which cannot set up the apk v3 releases.
          branch: v3.22
          packages: >
            build-base
            cmake
            g++
            linux-headers
            git
            bash
            build-base
      - name: Prepare
        run: |
          cmake -DFASTFLOAT_TEST=ON -B build
        shell: alpine.sh {0}
      - name: Build
        run: |
          cmake --build build
        shell: alpine.sh {0}
      - name: Test
        run: |
          ctest --test-dir build -R basictest
        shell: alpine.sh {0}
